[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "data-copilot"
version = "0.1.0"
description = "A safe, evidence-first data analysis agent foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
